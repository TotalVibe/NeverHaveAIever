<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#1e1838" />
      <stop offset="100%" stop-color="#0a0b10" />
    </radialGradient>
    <linearGradient id="flame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="50%" stop-color="#ff3366" />
      <stop offset="100%" stop-color="#ff9900" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(255, 45, 117, 0.25)" stroke-width="4" />
  <g filter="url(#glow)">
    <circle cx="256" cy="256" r="140" fill="rgba(255, 45, 117, 0.12)" />
  </g>
  <!-- Main Emoji Center -->
  <text x="256" y="305" font-size="190" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">😈</text>
  <!-- Directional Accent Dots -->
  <circle cx="256" cy="70" r="12" fill="#ff2d75" />
  <circle cx="70" cy="256" r="12" fill="#ff922b" />
  <circle cx="442" cy="256" r="12" fill="#20c997" />
  <circle cx="256" cy="442" r="12" fill="#748ffc" />
</svg>
