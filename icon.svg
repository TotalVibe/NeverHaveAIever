<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Fondo oscuro redondeado con sutil aura violeta -->
    <radialGradient id="bgDark" cx="50%" cy="54%" r="65%">
      <stop offset="0%" stop-color="#320e42" />
      <stop offset="55%" stop-color="#14081c" />
      <stop offset="100%" stop-color="#08060c" />
    </radialGradient>

    <!-- Resplandor detrás del demonio -->
    <radialGradient id="auraGlow" cx="50%" cy="54%" r="50%">
      <stop offset="0%" stop-color="#b52ef2" stop-opacity="0.5" />
      <stop offset="70%" stop-color="#5c1285" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#5c1285" stop-opacity="0" />
    </radialGradient>

    <!-- Esfera 3D del demonio -->
    <radialGradient id="devilHead3D" cx="38%" cy="24%" r="76%">
      <stop offset="0%" stop-color="#ee9eff" />
      <stop offset="30%" stop-color="#b33ef7" />
      <stop offset="72%" stop-color="#6912b5" />
      <stop offset="100%" stop-color="#360466" />
    </radialGradient>

    <!-- Degradado 3D para los cuernos -->
    <linearGradient id="horn3D" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7ac3" />
      <stop offset="45%" stop-color="#ab1f6e" />
      <stop offset="100%" stop-color="#470631" />
    </linearGradient>

    <!-- Brillo especular en la frente -->
    <linearGradient id="foreheadGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Halo dorado -->
    <linearGradient id="goldHalo" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff9b0" />
      <stop offset="48%" stop-color="#ffca28" />
      <stop offset="100%" stop-color="#f57c00" />
    </linearGradient>

    <!-- Degradado 3D y brillo de la lengua -->
    <radialGradient id="tongue3D" cx="40%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ff7597" />
      <stop offset="45%" stop-color="#e61c4b" />
      <stop offset="100%" stop-color="#870422" />
    </radialGradient>

    <!-- Resplandor del halo -->
    <filter id="haloAura" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Recorte para ojos entrecerrados con cara de malo -->
    <clipPath id="evilEyeLeft">
      <path d="M -95,-42 L -12,-14 L -12,35 L -95,35 Z" />
    </clipPath>
    <clipPath id="evilEyeRight">
      <path d="M 95,-42 L 12,-14 L 12,35 L 95,35 Z" />
    </clipPath>
  </defs>

  <!-- Cuadrado redondeado de fondo -->
  <rect width="512" height="512" rx="120" fill="url(#bgDark)" />
  <circle cx="256" cy="276" r="235" fill="url(#auraGlow)" />

  <!-- Grupo principal EXTRA GRANDE -->
  <g transform="translate(256, 294)">
    <!-- Cuernos curvos grandes y afilados -->
    <path d="M -94,-108 C -152,-138 -166,-198 -136,-224 C -130,-184 -98,-160 -48,-142 Z" fill="url(#horn3D)" />
    <path d="M 94,-108 C 152,-138 166,-198 136,-224 C 130,-184 98,-160 48,-142 Z" fill="url(#horn3D)" />

    <!-- Cabeza gigante del demonio -->
    <circle cx="0" cy="0" r="164" fill="url(#devilHead3D)" />

    <!-- Brillo de la frente -->
    <ellipse cx="0" cy="-88" rx="96" ry="48" fill="url(#foreheadGloss)" />

    <!-- Halo dorado flotante -->
    <ellipse cx="0" cy="-214" rx="94" ry="21" fill="none" stroke="url(#goldHalo)" stroke-width="15" filter="url(#haloAura)" />
    <ellipse cx="0" cy="-216" rx="92" ry="18" fill="none" stroke="#fffde7" stroke-width="3.5" opacity="0.9" />

    <!-- Ojo izquierdo entrecerrado (cara de malo) -->
    <g clip-path="url(#evilEyeLeft)">
      <ellipse cx="-54" cy="-16" rx="32" ry="36" fill="#ffffff" />
      <circle cx="-46" cy="-12" r="16.5" fill="#1b032e" />
      <circle cx="-52" cy="-18" r="5" fill="#ffffff" />
    </g>

    <!-- Ojo derecho entrecerrado (cara de malo) -->
    <g clip-path="url(#evilEyeRight)">
      <ellipse cx="54" cy="-16" rx="32" ry="36" fill="#ffffff" />
      <circle cx="46" cy="-12" r="16.5" fill="#1b032e" />
      <circle cx="40" cy="-18" r="5" fill="#ffffff" />
    </g>

    <!-- Cejas malvadas gruesas y muy inclinadas -->
    <path d="M -98,-48 Q -52,-36 -12,-14" fill="none" stroke="#1e0333" stroke-width="16" stroke-linecap="round" />
    <path d="M 98,-48 Q 52,-36 12,-14" fill="none" stroke="#1e0333" stroke-width="16" stroke-linecap="round" />

    <!-- Arruga del entrecejo -->
    <path d="M -10,-28 Q 0,-22 10,-28" fill="none" stroke="#360466" stroke-width="5" stroke-linecap="round" opacity="0.75" />

    <!-- Sonrisa diabólica ancha -->
    <path d="M -88,36 C -42,74 42,74 88,36 C 64,104 -64,104 -88,36 Z" fill="#1e0333" />
    <!-- Comisuras afiladas hacia arriba -->
    <path d="M -94,30 Q -84,42 -76,44" fill="none" stroke="#1e0333" stroke-width="8" stroke-linecap="round" />
    <path d="M 94,30 Q 84,42 76,44" fill="none" stroke="#1e0333" stroke-width="8" stroke-linecap="round" />

    <!-- Lengua orgánica y carnosa saliendo de la comisura -->
    <g>
      <path d="M 10,64 C 32,60 54,52 68,46 C 82,76 74,114 48,122 C 24,129 8,100 10,64 Z" fill="url(#tongue3D)" />
      <!-- Surco central curvo de la lengua -->
      <path d="M 40,58 Q 48,84 48,106" fill="none" stroke="#75021c" stroke-width="5" stroke-linecap="round" opacity="0.75" />
      <!-- Reflejo húmedo en la lengua -->
      <ellipse cx="32" cy="84" rx="7" ry="15" transform="rotate(-18 32 84)" fill="#ffffff" opacity="0.28" />
    </g>
  </g>
</svg>
