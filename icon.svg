<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dark Rounded Background -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1d1326" />
      <stop offset="100%" stop-color="#0d0e14" />
    </radialGradient>

    <!-- Inner Plum Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5c1d3c" stop-opacity="0.75" />
      <stop offset="70%" stop-color="#3a1329" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#3a1329" stop-opacity="0" />
    </radialGradient>

    <!-- Classic 3D Emoji Sphere Shading -->
    <radialGradient id="devil3D" cx="38%" cy="28%" r="72%">
      <stop offset="0%" stop-color="#e382ff" />
      <stop offset="35%" stop-color="#a838f5" />
      <stop offset="75%" stop-color="#6d17b8" />
      <stop offset="100%" stop-color="#3f0873" />
    </radialGradient>

    <!-- Horn Shading -->
    <linearGradient id="hornGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d86bff" />
      <stop offset="60%" stop-color="#7c1ec9" />
      <stop offset="100%" stop-color="#450a7a" />
    </linearGradient>

    <!-- Forehead Gloss Highlight -->
    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.42" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Golden Halo Gradient -->
    <linearGradient id="haloGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff59d" />
      <stop offset="50%" stop-color="#ffca28" />
      <stop offset="100%" stop-color="#ff8f00" />
    </linearGradient>

    <!-- Angel Halo Glow -->
    <filter id="haloGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- App Icon Rounded Square -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />

  <!-- Subtle Inner Glow -->
  <circle cx="256" cy="256" r="165" fill="url(#centerGlow)" />

  <!-- Orbit Ring -->
  <circle cx="256" cy="256" r="186" fill="none" stroke="#591c3a" stroke-width="5" />

  <!-- 4 Cardinal Swipe Dots (Pink Top, Emerald Right, Periwinkle Bottom, Orange Left) -->
  <circle cx="256" cy="70" r="12" fill="#ff2a7a" />
  <circle cx="442" cy="256" r="12" fill="#1fd196" />
  <circle cx="256" cy="442" r="12" fill="#6e8efb" />
  <circle cx="70" cy="256" r="12" fill="#ff9429" />

  <!-- Centered & Enlarged Classic 3D Devil Emoji + Halo -->
  <g transform="translate(256, 276) scale(1.45)">
    <!-- Curved Devil Horns (Classic Emoji Silhouette) -->
    <path d="M -38,-56 C -68,-74 -76,-104 -60,-118 C -58,-98 -42,-86 -18,-76 Z" fill="url(#hornGrad)" />
    <path d="M 38,-56 C 68,-74 76,-104 60,-118 C 58,-98 42,-86 18,-76 Z" fill="url(#hornGrad)" />

    <!-- 3D Shaded Devil Head -->
    <circle cx="0" cy="-6" r="76" fill="url(#devil3D)" />

    <!-- Specular Forehead Gloss -->
    <ellipse cx="0" cy="-42" rx="48" ry="26" fill="url(#glossGrad)" />

    <!-- Glowing Golden Angel Halo Ring -->
    <ellipse cx="0" cy="-104" rx="48" ry="12.5" fill="none" stroke="url(#haloGrad)" stroke-width="8" filter="url(#haloGlow)" />
    <ellipse cx="0" cy="-105.5" rx="46" ry="10.5" fill="none" stroke="#fffde7" stroke-width="2" opacity="0.85" />

    <!-- Classic Arched Mischievous Eyebrows -->
    <path d="M -48,-24 C -36,-35 -20,-28 -11,-15" fill="none" stroke="#24053d" stroke-width="6.5" stroke-linecap="round" />
    <path d="M 48,-24 C 36,-35 20,-28 11,-15" fill="none" stroke="#24053d" stroke-width="6.5" stroke-linecap="round" />

    <!-- Classic Emoji Oval Eyes -->
    <ellipse cx="-26" cy="-7" rx="9.5" ry="12.5" fill="#24053d" />
    <ellipse cx="26" cy="-7" rx="9.5" ry="12.5" fill="#24053d" />
    <circle cx="-29" cy="-11" r="3" fill="#ffffff" opacity="0.75" />
    <circle cx="23" cy="-11" r="3" fill="#ffffff" opacity="0.75" />

    <!-- Tapered Crescent Smirk -->
    <path d="M -36,18 C -16,38 16,38 36,18 C 20,48 -20,48 -36,18 Z" fill="#24053d" />
  </g>
</svg>
