<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Fondo oscuro redondeado con sutil halo violeta -->
    <radialGradient id="bgDark" cx="50%" cy="54%" r="65%">
      <stop offset="0%" stop-color="#2e0f3d" />
      <stop offset="55%" stop-color="#15091d" />
      <stop offset="100%" stop-color="#09070d" />
    </radialGradient>

    <!-- Resplandor detrás del personaje -->
    <radialGradient id="auraGlow" cx="50%" cy="52%" r="48%">
      <stop offset="0%" stop-color="#a82be2" stop-opacity="0.45" />
      <stop offset="65%" stop-color="#5c1285" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#5c1285" stop-opacity="0" />
    </radialGradient>

    <!-- Esfera 3D del demonio -->
    <radialGradient id="devilHead3D" cx="38%" cy="26%" r="74%">
      <stop offset="0%" stop-color="#ea94ff" />
      <stop offset="32%" stop-color="#b33ef7" />
      <stop offset="72%" stop-color="#6e16ba" />
      <stop offset="100%" stop-color="#3c066e" />
    </radialGradient>

    <!-- Degradado 3D para los cuernos -->
    <linearGradient id="horn3D" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f078b8" />
      <stop offset="45%" stop-color="#a6246d" />
      <stop offset="100%" stop-color="#4d0936" />
    </linearGradient>

    <!-- Brillo especular en la frente -->
    <linearGradient id="foreheadGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.48" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Halo dorado -->
    <linearGradient id="goldHalo" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff9b0" />
      <stop offset="48%" stop-color="#ffca28" />
      <stop offset="100%" stop-color="#f57c00" />
    </linearGradient>

    <!-- Degradado 3D de la lengua -->
    <linearGradient id="tongue3D" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff5277" />
      <stop offset="60%" stop-color="#d91642" />
      <stop offset="100%" stop-color="#8f0725" />
    </linearGradient>

    <!-- Resplandor del halo -->
    <filter id="haloAura" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Cuadrado redondeado de fondo -->
  <rect width="512" height="512" rx="120" fill="url(#bgDark)" />
  <circle cx="256" cy="270" r="220" fill="url(#auraGlow)" />

  <!-- Grupo principal centrado y grande -->
  <g transform="translate(256, 286)">
    <!-- Cuernos curvos -->
    <path d="M -82,-96 C -132,-124 -144,-176 -118,-198 C -114,-164 -86,-142 -42,-126 Z" fill="url(#horn3D)" />
    <path d="M 82,-96 C 132,-124 144,-176 118,-198 C 114,-164 86,-142 42,-126 Z" fill="url(#horn3D)" />

    <!-- Cabeza grande del demonio -->
    <circle cx="0" cy="0" r="144" fill="url(#devilHead3D)" />

    <!-- Brillo de la frente -->
    <ellipse cx="0" cy="-76" rx="86" ry="44" fill="url(#foreheadGloss)" />

    <!-- Halo dorado flotante -->
    <ellipse cx="0" cy="-190" rx="84" ry="20" fill="none" stroke="url(#goldHalo)" stroke-width="14" filter="url(#haloAura)" />
    <ellipse cx="0" cy="-192" rx="82" ry="17" fill="none" stroke="#fffde7" stroke-width="3.5" opacity="0.9" />

    <!-- Ojos blancos expresivos -->
    <ellipse cx="-48" cy="-16" rx="28" ry="34" fill="#ffffff" />
    <ellipse cx="48" cy="-16" rx="28" ry="34" fill="#ffffff" />

    <!-- Pupilas mirando ligeramente al centro -->
    <circle cx="-41" cy="-13" r="15" fill="#1e0533" />
    <circle cx="41" cy="-13" r="15" fill="#1e0533" />
    <!-- Reflejos de luz en las pupilas -->
    <circle cx="-46" cy="-19" r="5" fill="#ffffff" />
    <circle cx="36" cy="-19" r="5" fill="#ffffff" />

    <!-- Cejas arqueadas traviesas -->
    <path d="M -84,-36 C -64,-58 -32,-48 -16,-24" fill="none" stroke="#24043d" stroke-width="12" stroke-linecap="round" />
    <path d="M 84,-36 C 64,-58 32,-48 16,-24" fill="none" stroke="#24043d" stroke-width="12" stroke-linecap="round" />

    <!-- Boca sonriente abierta -->
    <path d="M -74,34 C -36,68 36,68 74,34 C 54,94 -54,94 -74,34 Z" fill="#24043d" />

    <!-- Lengua sacada hacia un lado -->
    <g transform="translate(26, 62) rotate(-14)">
      <path d="M -26,-6 L 26,-6 L 26,32 C 26,52 -26,52 -26,32 Z" fill="url(#tongue3D)" />
      <!-- Línea central de la lengua -->
      <path d="M 0,0 L 0,30" stroke="#8f0725" stroke-width="4.5" stroke-linecap="round" opacity="0.7" />
    </g>
  </g>
</svg>
