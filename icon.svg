<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dark Rounded Background -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1d1326" />
      <stop offset="100%" stop-color="#0d0e14" />
    </radialGradient>

    <!-- Inner Plum Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5c1d3c" stop-opacity="0.75" />
      <stop offset="70%" stop-color="#3a1329" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#3a1329" stop-opacity="0" />
    </radialGradient>

    <!-- Devil Face Gradient -->
    <linearGradient id="devilGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c84bff" />
      <stop offset="55%" stop-color="#8b2be2" />
      <stop offset="100%" stop-color="#5a149c" />
    </linearGradient>

    <!-- Angel Halo Glow -->
    <filter id="haloGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- App Icon Rounded Square -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />

  <!-- Subtle Inner Glow -->
  <circle cx="256" cy="256" r="165" fill="url(#centerGlow)" />

  <!-- Orbit Ring -->
  <circle cx="256" cy="256" r="186" fill="none" stroke="#591c3a" stroke-width="5" />

  <!-- 4 Cardinal Swipe Dots (Pink Top, Emerald Right, Periwinkle Bottom, Orange Left) -->
  <circle cx="256" cy="70" r="12" fill="#ff2a7a" />
  <circle cx="442" cy="256" r="12" fill="#1fd196" />
  <circle cx="256" cy="442" r="12" fill="#6e8efb" />
  <circle cx="70" cy="256" r="12" fill="#ff9429" />

  <!-- Centered Devil + Angel Halo Group -->
  <g transform="translate(256, 268)">
    <!-- Left & Right Devil Horns -->
    <path d="M -52,-54 C -74,-78 -72,-104 -54,-114 C -56,-94 -44,-80 -28,-72 Z" fill="url(#devilGrad)" />
    <path d="M 52,-54 C 74,-78 72,-104 54,-114 C 56,-94 44,-80 28,-72 Z" fill="url(#devilGrad)" />

    <!-- Devil Head -->
    <circle cx="0" cy="-6" r="76" fill="url(#devilGrad)" />

    <!-- Glowing Golden Angel Halo Ring Floating Above Horns -->
    <ellipse cx="0" cy="-106" rx="46" ry="12" fill="none" stroke="#ffd54f" stroke-width="7" filter="url(#haloGlow)" />
    <ellipse cx="0" cy="-106" rx="46" ry="12" fill="none" stroke="#fff3b0" stroke-width="2.5" />

    <!-- Mischievous Angled Eyebrows -->
    <path d="M -42,-30 L -14,-18" stroke="#1b072e" stroke-width="7" stroke-linecap="round" />
    <path d="M 42,-30 L 14,-18" stroke="#1b072e" stroke-width="7" stroke-linecap="round" />

    <!-- Eyes -->
    <ellipse cx="-26" cy="-10" rx="8" ry="10" fill="#1b072e" />
    <ellipse cx="26" cy="-10" rx="8" ry="10" fill="#1b072e" />
    <circle cx="-23" cy="-13" r="2.5" fill="#ffffff" />
    <circle cx="29" cy="-13" r="2.5" fill="#ffffff" />

    <!-- Cheeky Smirk -->
    <path d="M -32,18 Q 0,44 32,18" fill="none" stroke="#1b072e" stroke-width="7" stroke-linecap="round" />
  </g>
</svg>
